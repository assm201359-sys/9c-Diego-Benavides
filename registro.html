<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro Skate Life</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}



body{

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;


background:


linear-gradient(
rgba(0,0,0,.75),
rgba(0,0,0,.75)
),


url("https://images.unsplash.com/photo-1520045892732-304bc3ac5d8e?auto=format&fit=crop&w=1600&q=80");

background-size:cover;

background-position:center;

color:white;

}





.contenedor{


width:450px;


background:rgba(0,0,0,.85);


padding:35px;


border-radius:30px;


border:3px solid #39FF14;


box-shadow:

0 0 25px #39FF14,
0 0 60px #39FF14;


text-align:center;


animation:entrada 1s;


}





@keyframes entrada{


from{

transform:translateY(-50px);

opacity:0;

}


to{

transform:translateY(0);

opacity:1;

}


}




.logo{


font-size:50px;


color:#39FF14;


text-shadow:

0 0 15px #39FF14;


margin-bottom:15px;


}





h2{

color:white;

margin-bottom:25px;

font-size:30px;

}




label{


display:block;

text-align:left;

margin-left:10px;

color:#39FF14;

font-weight:bold;

}



input{


width:100%;


padding:15px;


margin:10px 0 20px;


border:none;


border-radius:15px;


font-size:16px;


outline:none;


}



input:focus{


box-shadow:0 0 20px #39FF14;


}





button{


width:100%;


background:#39FF14;


color:black;


border:none;


padding:15px;


border-radius:40px;


font-size:18px;


font-weight:bold;


cursor:pointer;


transition:.4s;


}




button:hover{


background:white;


transform:scale(1.08);


box-shadow:0 0 25px white;


}





.skater{


position:absolute;


right:50px;


bottom:20px;


}



.skater img{


width:220px;


filter:drop-shadow(0 0 20px #39FF14);


}




.mensaje{


margin-top:20px;


color:#39FF14;


font-size:18px;


}



</style>


</head>




<body>




<div class="contenedor">


<div class="logo">

🛹

</div>



<h2>
Únete a Skate Life
</h2>



<form>


<label>
Nombre de Skater
</label>

<input 
type="text" 
id="nombre"
placeholder="Ejemplo: Diego">


<label>
Usuario
</label>


<input 
type="text"
id="usuario"
placeholder="Crea tu usuario">



<label>
Contraseña
</label>


<input 
type="password"
id="password"
placeholder="Crea tu contraseña">





<button type="button" onclick="registrar()">

🔥 Entrar al Team Skate

</button>



</form>



<div class="mensaje" id="mensaje">

</div>



</div>






<div class="skater">

<img src="https://images.unsplash.com/photo-1547447134-cd3f5c716030?auto=format&fit=crop&w=500&q=80">

</div>







<script>


function registrar(){


let nombre=document.getElementById("nombre").value;


let usuario=document.getElementById("usuario").value;


let password=document.getElementById("password").value;



if(nombre=="" || usuario=="" || password==""){


document.getElementById("mensaje").innerHTML=

"⚠️ Completa todos los campos";


return;


}





localStorage.setItem(
"nombre",
nombre
);



localStorage.setItem(
"usuario",
usuario
);



localStorage.setItem(
"password",
password
);





document.getElementById("mensaje").innerHTML=

"🔥 Registro exitoso... Entrando al mundo Skate";



setTimeout(function(){


location.href="menu.html";


},1500);



}



</script>





</body>

</html>
