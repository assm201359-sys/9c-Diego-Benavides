<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tareas Skate Life</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}



body{


min-height:100vh;


background:


linear-gradient(
rgba(0,0,0,.75),
rgba(0,0,0,.75)
),


url("https://images.unsplash.com/photo-1520045892732-304bc3ac5d8e?auto=format&fit=crop&w=1600&q=80");


background-size:cover;

background-position:center;

color:white;

}





header{


padding:25px;


text-align:center;


background:rgba(0,0,0,.85);


border-bottom:3px solid #39FF14;


}



header h1{


font-size:50px;


color:#39FF14;


text-shadow:

0 0 15px #39FF14;


}






.contenedor{


width:500px;


margin:50px auto;


background:rgba(0,0,0,.85);


padding:30px;


border-radius:30px;


border:3px solid #39FF14;


box-shadow:

0 0 30px #39FF14;


}





h2{


text-align:center;


color:#39FF14;


margin-bottom:20px;


}




.entrada{


display:flex;


gap:10px;


}



input{


flex:1;


padding:15px;


border-radius:20px;


border:none;


font-size:16px;


}





button{


background:#39FF14;


border:none;


padding:12px 20px;


border-radius:30px;


font-weight:bold;


cursor:pointer;


transition:.3s;


}



button:hover{


background:white;


transform:scale(1.1);


}





ul{


margin-top:25px;


list-style:none;


}





li{


background:#222;


padding:18px;


margin:12px 0;


border-radius:20px;


border:2px solid #39FF14;


display:flex;


justify-content:space-between;


align-items:center;


cursor:pointer;


transition:.3s;


}





li:hover{


box-shadow:0 0 20px #39FF14;


transform:translateX(10px);


}





.completa{


text-decoration:line-through;


background:#145214;


opacity:.7;


}





.eliminar{


background:#ff3131;


color:white;


padding:8px 15px;


}



.volver{


display:block;


margin:30px auto;


width:200px;


}





</style>


</head>



<body>




<header>


<h1>
🛹 SKATE TASKS 🛹
</h1>


</header>






<div class="contenedor">



<h2>
🔥 Mis retos de Skater
</h2>





<div class="entrada">


<input 
id="nuevaTarea"
placeholder="Escribe un nuevo reto...">



<button onclick="agregar()">

+

</button>


</div>






<ul id="lista"></ul>





<button class="volver" onclick="location.href='menu.html'">

⬅ Volver al menú

</button>



</div>







<script>


let tareas=JSON.parse(localStorage.getItem("tareas")) || [];



mostrar();




function agregar(){


let texto=document.getElementById("nuevaTarea").value;



if(texto==""){

return;

}



tareas.push({

nombre:texto,

hecha:false

});



guardar();



document.getElementById("nuevaTarea").value="";


}




function mostrar(){



let lista=document.getElementById("lista");


lista.innerHTML="";



tareas.forEach((tarea,index)=>{


let li=document.createElement("li");



if(tarea.hecha){

li.classList.add("completa");

}



li.innerHTML=


`

<span onclick="completar(${index})">

🛹 ${tarea.nombre}

</span>


<button class="eliminar" onclick="eliminar(${index})">

X

</button>

`;



lista.appendChild(li);



});


}




function completar(index){


tareas[index].hecha=
!tareas[index].hecha;


guardar();


}





function eliminar(index){


tareas.splice(index,1);


guardar();


}




function guardar(){


localStorage.setItem(

"tareas",

JSON.stringify(tareas)

);


mostrar();


}



</script>



</body>

</html>
