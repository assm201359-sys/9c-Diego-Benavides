<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Diario Skate Life</title>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}



body{


min-height:100vh;


background:


linear-gradient(
rgba(0,0,0,.75),
rgba(0,0,0,.75)
),


url("https://images.unsplash.com/photo-1520045892732-304bc3ac5d8e?auto=format&fit=crop&w=1600&q=80");


background-size:cover;

background-position:center;


color:white;


}





header{


background:rgba(0,0,0,.85);


padding:25px;


text-align:center;


border-bottom:3px solid #39FF14;


}



header h1{


font-size:50px;


color:#39FF14;


text-shadow:


0 0 15px #39FF14;



}






.contenedor{


width:600px;


margin:40px auto;


background:rgba(0,0,0,.85);


padding:30px;


border-radius:30px;


border:3px solid #39FF14;


box-shadow:0 0 30px #39FF14;



}




h2{


color:#39FF14;


text-align:center;


margin-bottom:25px;


}





input,textarea{


width:100%;


padding:15px;


margin-bottom:15px;


border:none;


border-radius:15px;


font-size:16px;


}





textarea{


height:130px;


resize:none;


}




button{


background:#39FF14;


color:black;


border:none;


padding:12px 25px;


border-radius:30px;


font-weight:bold;


cursor:pointer;


transition:.3s;


}



button:hover{


background:white;


transform:scale(1.1);


}






.entrada{


background:#222;


margin-top:25px;


padding:20px;


border-radius:20px;


border:2px solid #39FF14;


transition:.3s;


}




.entrada:hover{


box-shadow:0 0 20px #39FF14;


transform:translateY(-5px);


}




.favorita{


background:#174d17;


box-shadow:0 0 25px #39FF14;


}





.entrada h3{


color:#39FF14;


font-size:25px;


}





.fecha{


color:#00ffff;


}



.eliminar{


background:#ff3131;


color:white;


margin-top:15px;


}





.volver{


display:block;


margin:30px auto 0;


}





</style>

</head>



<body>




<header>


<h1>
📖 SKATE DIARY 🛹
</h1>


</header>





<div class="contenedor">


<h2>
🔥 Mis aventuras sobre la tabla
</h2>




<input 
id="titulo"
placeholder="Título de la entrada...">





<input 
id="fecha"
type="date">





<textarea 
id="texto"
placeholder="Escribe tu experiencia de skate..."></textarea>





<button onclick="guardar()">

📝 Guardar Entrada

</button>





<div id="diario"></div>




<button class="volver" onclick="location.href='menu.html'">

⬅ Volver al menú

</button>



</div>







<script>



let entradas=

JSON.parse(localStorage.getItem("diario")) || [];




mostrar();





function guardar(){



let titulo=

document.getElementById("titulo").value;


let fecha=

document.getElementById("fecha").value;


let texto=

document.getElementById("texto").value;





if(titulo=="" || texto==""){

alert("Completa tu entrada");

return;

}




entradas.push({

titulo,
fecha,
texto,
favorita:false

});





localStorage.setItem(

"diario",

JSON.stringify(entradas)

);





document.getElementById("titulo").value="";

document.getElementById("fecha").value="";

document.getElementById("texto").value="";



mostrar();



}






function mostrar(){



let caja=document.getElementById("diario");


caja.innerHTML="";




entradas.forEach((e,index)=>{



let div=document.createElement("div");


div.className="entrada";



if(e.favorita){

div.classList.add("favorita");

}



div.onclick=function(){

favorita(index);

}




div.innerHTML=


`

<h3>🛹 ${e.titulo}</h3>


<p class="fecha">

📅 ${e.fecha}

</p>


<br>


<p>

${e.texto}

</p>


<button class="eliminar" onclick="event.stopPropagation(); eliminar(${index})">

❌ Borrar

</button>


`;



caja.appendChild(div);



});



}





function favorita(index){


entradas[index].favorita=

!entradas[index].favorita;


guardarDatos();


}







function eliminar(index){


entradas.splice(index,1);


guardarDatos();


}




function guardarDatos(){


localStorage.setItem(

"diario",

JSON.stringify(entradas)

);



mostrar();



}



</script>




</body>

</html>
